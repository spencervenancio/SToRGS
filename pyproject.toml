[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genomics"
version = "0.1.0"
description = "Per-sequence feature selection with error control for regulatory DNA models"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "torch>=2.0",
]

[project.optional-dependencies]
# TF-MoDISco field baseline (experiments/*tfmodisco*.py). tangermeme and
# tfmodisco themselves are vendored under data/third_party/, see the config.
tfmodisco = ["h5py>=3.8"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["genomics*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
